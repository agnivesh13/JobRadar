# NATS server for JobRadar.
http_port: 8222

jetstream {
  store_dir: /data
  # Flush every write to disk before acknowledging it. The default flushes
  # every two minutes, which is fast but means a SIGKILL of this container can
  # leave stream and consumer state disagreeing (found by scripts/chaos.sh).
  # JobRadar moves a few thousand messages a minute, so the cost is invisible.
  sync_interval: always
}
