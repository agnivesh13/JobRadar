<html><head><script type="text/javascript">var phApp = phApp || {}; phApp.ddo = {"jobDetail":{"status":200,"data":{"job":{"jobSeqNo":"IFBAINP209313ENIN","jobId":"P-209313","title":"Cyber Security Analyst","description":"<strong>Job Requirements </strong><br><br/><h3>About the Role</h3><p>The <strong>Cyber Security Analyst</strong> plays a critical role in safeguarding the organization’s digital infrastructure by conducting vulnerability assessments, monitoring network traffic, and supporting security operations. This role involves hands-on technical work, collaboration with cross-functional teams, and contributing to governance, risk, and compliance activities. The analyst will also assist in integrating systems and applications with the Security Operations Center (SOC) and ensure timely and high-quality delivery of assigned tasks.</p><br/><h3>Key Responsibilities</h3><h5>Primary Responsibilities</h5><ul><li>Perform hands-on Vulnerability Assessment (VA), Penetration Testing (PT), and Application Security evaluations.</li><li>Participate in security architecture reviews to identify and mitigate risks.</li><li>Support system and application integrations with the Security Operations Center (SOC).</li><li>Monitor network traffic for suspicious activity and potential threats.</li><li>Assist in writing security rules and alerts for threat detection.</li><li>Contribute to governance, risk, and compliance (GRC) initiatives.</li><li>Conduct reviews of bank applications, network infrastructure, and server environments under the guidance of a supervisor.</li></ul><h5>Secondary Responsibilities</h5><ul><li>Configure security solutions as required to support operational needs.</li><li>Work independently as an individual contributor while seeking guidance when necessary.</li><li>Collaborate effectively as a team player to achieve shared goals.</li><li>Ensure timely completion of assigned tasks with a focus on quality and accuracy.</li><li>Demonstrate strong communication and interpersonal skills to work effectively within a team.</li></ul><br/><h3>What We Are Looking For</h3><h5>Education</h5><ul><li>Graduation: Full time BE, B. Tech in any discipline from a recognised institution.</li><li>Post-graduation: ME, M. Tech in any discipline from a recognised institution.</li></ul><h5>Experience</h5><ul><li>Minimum of 2 to 5 years&nbsp;of relevant experience in cybersecurity, including hands-on assessments and security operations within BFSI, IT/ITES industry.</li></ul><h5>Skills and Attributes</h5><ul><li>Proficiency in vulnerability assessment, penetration testing, and application security.</li><li>Understanding of network traffic monitoring and threat detection.</li><li>Familiarity with security architecture and integration with SOC.</li><li>Experience in GRC activities and infrastructure reviews.</li><li>Ability to configure and manage security tools and solutions.</li><li>Strong analytical and problem-solving skills.</li><li>Effective communication and teamwork capabilities.</li><li>Professional certifications such as<strong>CISSP, CISA, or CISM</strong>are preferred.</li></ul><br><br>","location":"Navi Mumbai, Maharashtra, India","multi_location":[{"country":"India","cityState":"Navi Mumbai, Maharashtra","city":"Navi Mumbai","latlong":{"lon":73.01582,"lat":19.03681},"latitude":"19.03681","location":"Airoli, Navi Mumbai, Maharashtra, India","state":"Maharashtra","cityCountry":"Navi Mumbai, India","cityStateCountry":"Navi Mumbai, Maharashtra, India","stateCountry":"Maharashtra, India","longitude":"73.01582"}],"postedDate":"2026-04-16T00:00:00.000+0000","type":"Full-Time","category":"Risk & Governance","country":"India","city":"Navi Mumbai"}}}}; phApp.experimentData = {};</script></head><body></body></html>
